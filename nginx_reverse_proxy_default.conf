# ============================================================
# 🏛️ PREFEITURA MUNICIPAL DE DUQUE DE CAXIAS — RJ
# NGINX — Reverse Proxy Central Unificado (/etc/nginx/sites-available/default)
# ============================================================

# UPSTREAMS DOS SERVIÇOS EM PRODUÇÃO
upstream asa_upstream      { server 127.0.0.1:8100; }
upstream pce_backend       { server 127.0.0.1:6000; }
upstream tzapp_backend     { server 127.0.0.1:3004; }
upstream geo_backend       { server 127.0.0.1:3032; }
upstream duque_ia_backend  { server 127.0.0.1:3000; }
upstream sigem_backend     { server 127.0.0.1:3015; }

# Limitação de taxa para APIs (DDoS / Brute-force protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ============================================================
# Servidor Principal HTTP (Porta 80)
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name ogm.duquedecaxias.rj.gov.br ogmanalytics.duquedecaxias.rj.gov.br;
    client_max_body_size 25M;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Otimização de Compressão GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript 
        application/font-woff2 
        image/svg+xml;

    # ============================================================
    # 1. CSG — HUB CENTRAL (raiz)
    # ============================================================
    location / {
        root /home/administrator/4EM1/CSG;
        index index.html;
        try_files $uri $uri/ =404;
        expires 1h;
    }

    # ============================================================
    # 2. ASA — Ouvidoria & Inteligência
    # ============================================================
    location /asa/ {
        proxy_pass http://asa_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 3. G.E.O — Geoprocessamento & Estruturas
    # ============================================================
    location /geo/assets/ {
        alias /home/administrator/G.E.O/frontend-react/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /geo/ {
        alias /home/administrator/G.E.O/frontend-react/dist/;
        index index.html;
        try_files $uri $uri/ /geo/index.html;
    }

    location /geo/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://geo_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 4. PCE — Gerenciador Sebrae
    # ============================================================
    location /pce/ {
        alias /home/administrator/4EM1/PCE/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /pce/index.html;
    }

    location /pce/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://pce_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://pce_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # 5. TZAPPGERAL — Monitoramento Transporte (PWA)
    # ============================================================
    location ^~ /tarifazero/assets/ {
        alias /home/administrator/4EM1/tzappgeral/TZ-APP/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /tarifazero/sw.js {
        alias /home/administrator/4EM1/tzappgeral/TZ-APP/dist/sw.js;
        add_header Cache-Control "no-store";
    }

    location /tarifazero/ {
        alias /home/administrator/4EM1/tzappgeral/TZ-APP/dist/;
        index index.html;
        try_files $uri $uri/ /tarifazero/index.html;
    }

    location /tarifazero/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://tzapp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 6. SIGEM — Gestão de Endereços Municipais (Porta 3015)
    # ============================================================
    location /sigem/ {
        proxy_pass http://sigem_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /sigem/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://sigem_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alias alternativo /enderecos -> redireciona para /sigem/
    location /enderecos {
        return 301 /sigem/;
    }

    # ============================================================
    # 7. DUQUE IA — Backend de Inteligência Artificial (Porta 3000)
    # ============================================================
    location /duqueia/ {
        proxy_pass http://duque_ia_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
